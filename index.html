<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NFC Artist Canvas</title>
  <link rel="stylesheet" href="style.css">
  <!-- Fuentes temáticas de Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Montserrat:wght@300;400;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- 1. Pantalla de Intro Retro 80s (Barra de Sangre & Cuchillo) -->
  <div id="intro-screen">
    <div class="loader-container">
      <p class="retro-title">LOADING PORTFOLIO...</p>
      
      <div class="progress-bar-track">
        <div class="blood-trail" id="blood-trail"></div>
        <img src="chucky-knife.png" alt="Cuchillo Chucky" class="knife-loader" id="knife-loader">
      </div>

      <div class="retro-counter">
        <span id="load-percentage">0</span>%
      </div>
    </div>
  </div>

  <!-- 2. Galería Flotante de Fondo -->
  <div id="floating-gallery"></div>

  <!-- 3. Contenedor Principal: TV CRT y Estantería VHS -->
  <main class="main-container">
    <div class="retro-setup">
      
      <!-- Televisor CRT -->
      <div class="crt-tv-container" id="crt-tv">
        <div class="tv-screen">
          <div class="screen-content" id="tv-content">
            <h1 class="artist-name">Tu Nombre</h1>
            <p class="artist-tagline">Arte & Ilustración</p>
            <p class="artist-bio">
              Selecciona una cinta VHS de la estantería para cargar una sección...
            </p>
          </div>
          <div class="scanlines"></div>
          <div class="tv-static" id="tv-static"></div>
        </div>
        <div class="vhs-slot-indicator">
          <span class="vhs-label">VHS PLAYER</span>
          <div class="vhs-slot-door" id="vhs-door"></div>
        </div>
      </div>

      <!-- Estantería con Cintas VHS -->
      <div class="vhs-shelf">
        <p class="shelf-title">-- SELECCIONA UNA CINTA --</p>
        
        <div class="tape-list">
          <button class="vhs-tape" data-type="instagram" data-url="https://instagram.com/tu_usuario">
            <span class="tape-spine">INSTAGRAM.vhs</span>
          </button>

          <button class="vhs-tape" data-type="email" data-url="mailto:tu_correo@email.com">
            <span class="tape-spine">CONTACTO_MAIL.vhs</span>
          </button>

          <button class="vhs-tape" data-type="bio" data-url="">
            <span class="tape-spine">SOBRE_EL_ARTISTA.vhs</span>
          </button>
        </div>
      </div>

    </div>
  </main>

  <!-- Enlace obligatorio a JavaScript (al final antes del cierre de body) -->
  <script src="script.js"></script>
</body>
</html>
