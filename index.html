<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NFC Artist Canvas</title>
  <link rel="stylesheet" href="style.css">
  <!-- Fuentes temáticas de Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Montserrat:wght@300;400;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- 1. Pantalla de Intro Retro 80s (Barra de Sangre & Cuchillo) -->
  <div id="intro-screen">
    <div class="loader-container">
      <p class="retro-title">LOADING PORTFOLIO...</p>
      
      <div class="progress-bar-track">
        <div class="blood-trail" id="blood-trail"></div>
        <img src="chucky-knife.png" 
     alt="Cuchillo Chucky" 
     class="knife-loader" 
     id="knife-loader"
     onerror="this.style.display='none'; document.querySelector('.blood-trail').style.boxShadow='0 0 10px red'">
      </div>

      <div class="retro-counter">
        <span id="load-percentage">0</span>%
      </div>
    </div>
  </div>

  <!-- 2. Galería Flotante de Fondo -->
  <div id="floating-gallery"></div>

<!-- 3. Contenedor Principal: TV CRT y Estantería VHS -->
<main class="main-container">
  <div class="retro-setup">
    
    <!-- Televisor CRT Real -->
    <div class="crt-tv-wrapper">
      <img src="tv.png" alt="Televisor CRT Retro" class="tv-frame-img">
      
      <div class="tv-screen-area">
        <div class="screen-content" id="tv-content">
          <h1 class="artist-name">Tu Nombre</h1>
          <p class="artist-tagline">Arte & Ilustración</p>
          <p class="artist-bio">
            Desliza y selecciona una cinta VHS...
          </p>
        </div>
        <div class="scanlines"></div>
        <div class="tv-static" id="tv-static"></div>
      </div>
    </div>

    <!-- Estantería con Carrusel Horizontal VHS -->
    <div class="vhs-shelf">
      <div class="shelf-header">
        <span class="shelf-arrow">◀</span>
        <p class="shelf-title">-- DESLIZA LAS CINTAS --</p>
        <span class="shelf-arrow">▶</span>
      </div>
      
      <div class="tape-slider" id="tape-slider">
        <!-- Cinta 1: Instagram -->
        <button class="vhs-tape-card" data-type="instagram" data-url="https://instagram.com/tu_usuario">
          <img src="vhs.png" alt="Cinta VHS Instagram" class="vhs-tape-img">
          <span class="vhs-sticker-label">INSTAGRAM // VOL.1</span>
        </button>

        <!-- Cinta 2: Email -->
        <button class="vhs-tape-card" data-type="email" data-url="mailto:tu_correo@email.com">
          <img src="vhs.png" alt="Cinta VHS Mail" class="vhs-tape-img">
          <span class="vhs-sticker-label">CONTACTO // MAIL</span>
        </button>

        <!-- Cinta 3: Bio -->
        <button class="vhs-tape-card" data-type="bio" data-url="">
          <img src="vhs.png" alt="Cinta VHS Bio" class="vhs-tape-img">
          <span class="vhs-sticker-label">BIOGRAFIA // ARTISTA</span>
        </button>
      </div>
    </div>

  </div>
</main>

  <!-- Enlace obligatorio a JavaScript (al final antes del cierre de body) -->
  <script src="script.js"></script>
</body>
</html>
