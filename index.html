<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#171310">
  <meta name="description" content="Xpiral, artista ochentera. Descubre su trabajo y síguela en Instagram.">
  <title>Xpiral — artista</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <div class="loader" id="loader" aria-label="Cargando la página">
    <div class="loader__inner">
      <span class="eyebrow">XPIRAL · PORTFOLIO</span>
      <svg class="loader__spiral" viewBox="0 0 200 200" role="img" aria-label="Espiral de carga">
        <path class="loader__track" d="M100 100 C112 100 112 112 100 112 C84 112 84 88 100 88 C124 88 124 124 100 124 C70 124 70 76 100 76 C136 76 136 136 100 136 C56 136 56 64 100 64 C148 64 148 148 100 148 C42 148 42 52 100 52"/>
        <path class="loader__fill" id="spiral-fill" d="M100 100 C112 100 112 112 100 112 C84 112 84 88 100 88 C124 88 124 124 100 124 C70 124 70 76 100 76 C136 76 136 136 100 136 C56 136 56 64 100 64 C148 64 148 148 100 148 C42 148 42 52 100 52"/>
      </svg>
      <div class="loader__status"><span>PREPARANDO LA GALERÍA</span><span id="load-percentage">0%</span></div>
    </div>
  </div>

  <main class="page page--home">
    <header class="topbar">
      <a class="wordmark" href="index.html" aria-label="Xpiral, inicio">X<span>P</span>IRAL</a>
      <span class="topbar__note">ARTISTA · ESPAÑA</span>
    </header>

    <section class="intro" aria-labelledby="artist-name">
      <div class="intro__copy">
        <span class="eyebrow intro__eyebrow"><span class="status-dot"></span> PORTFOLIO PERSONAL</span>
        <h1 id="artist-name">Xpiral<span class="intro__period">.</span></h1>
        <p class="intro__bio">Artista ochentera</p>
        <div class="intro__actions">
          <a class="button button--primary" href="gallery.html">Explorar artworks <span aria-hidden="true">↗</span></a>
          <a class="button button--outline" href="https://www.instagram.com/elenaxpiralart/" target="_blank" rel="noopener noreferrer">Instagram <span aria-hidden="true">↗</span></a>
        </div>
      </div>
      <div class="intro__art" aria-label="Selección de artworks de Xpiral">
        <figure class="art-card art-card--one"><img src="demo1.jpg" alt="Artwork de Xpiral" fetchpriority="high"><figcaption>01 / OBRA</figcaption></figure>
        <figure class="art-card art-card--two"><img src="demo3.jpg" alt="Artwork de Xpiral" fetchpriority="high"><figcaption>02 / OBRA</figcaption></figure>
        <span class="art-orbit" aria-hidden="true">X</span>
      </div>
    </section>

    <footer class="footer"><span>UN UNIVERSO VISUAL EN EXPANSIÓN</span><span>© XPIRAL</span></footer>
  </main>
</body>
</html>
